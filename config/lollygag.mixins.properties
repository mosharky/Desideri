# Lollygag mixin toggles. Changes take effect after restarting the game.

# Lets No Man's Land's generic cave biomes generate underneath biomes placed by Blueprint's modded biome slices.
# Only has an effect when Blueprint, No Man's Land, and a mod that uses Blueprint to place its biomes are installed,
# as well as cave biomes enabled in NML's config.
NMLCavesInBlueprintSlices=true
